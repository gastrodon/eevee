[package]
name = "eevee"
version = "0.2.0"
edition = "2021"
description = "Generalized NeuroEvolution toolkit, based on NEAT"
license = "AGPL-3.0-or-later"

[dependencies]
find-fold = "~0.1"
fxhash = "~0.2"
paste = "~1.0"
rand = "~0.9"
rand_distr = "~0.5"
rulinalg = "~0.4"

approx = { version = "~0.5", optional = true }
board-game = { version = "~0.8", optional = true }
rayon = { version = "~1.10", optional = true }
serde = { version = "~1.0", features = ["derive"], optional = true }
serde_json = { version = "~1.0", features = ["preserve_order"], optional = true }

[dev-dependencies]
criterion = "~0.5"
flamegraph = "~0.6"

[features]
approx = ["dep:approx"]
board-game = ["dep:board-game"]
parallel = ["dep:rayon"]
serialize = ["dep:serde"]
serialize_json = ["dep:serde_json", "serialize"]
smol_bench = []

[[example]]
name = "xor"
required-features = ["approx", "serialize_json"]

[[example]]
name = "tic-tac-toe"
path = "examples/board-game/tic-tac-toe.rs"
required-features = ["board-game"]

[[bench]]
name = "crossover"
harness = false
required-features = ["serialize"]

[[bench]]
name = "innogen"
harness = false

[[bench]]
name = "mutate"
harness = false
required-features = ["serialize"]

[[bench]]
name = "nn"
harness = false
required-features = ["serialize"]

[[bench]]
name = "random"
harness = false

[[bench]]
name = "alloc"
harness = false
required-features = ["serialize"]

[[bench]]
name = "reproduce"
harness = false
required-features = ["serialize"]

[[bench]]
name = "speciate"
harness = false
required-features = ["serialize"]
