[package]
name = "eevee"
version = "0.2.0"
edition = "2021"
description = "Generalized NeuroEvolution toolkit, based on NEAT"
license = "AGPL-3.0-or-later"

[dependencies]
find-fold = "~0.1"
fxhash = "~0.2"
paste = "~1.0"
rand = "~0.9"
rand_distr = "~0.5"
rulinalg = "~0.4"

approx = { version = "~0.5", optional = true }
rayon = { version = "~1.10", optional = true }
serde = { version = "~1.0", features = ["derive"], optional = true }
serde_json = { version = "~1.0", features = ["preserve_order"], optional = true }

[dev-dependencies]
criterion = "~0.5"
flamegraph = "~0.6"

[features]
approx = ["dep:approx"]
parallel = ["dep:rayon"]
serialize-json = ["dep:serde", "dep:serde_json"]
smol_bench = []

[[example]]
name = "xor"
required-features = ["approx", "serialize-json"]

[[example]]
name = "sentiment"
required-features = ["serialize-json"]

[[bench]]
name = "crossover"
harness = false

[[bench]]
name = "innogen"
harness = false

[[bench]]
name = "mutate"
harness = false

[[bench]]
name = "nn"
harness = false

[[bench]]
name = "random"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "reproduce"
harness = false

[[bench]]
name = "speciate"
harness = false
