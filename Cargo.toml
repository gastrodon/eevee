[package]
name = "eevee"
version = "0.2.0"
edition = "2021"
description = "Generalized NeuroEvolution toolkit, based on NEAT"
license = "AGPL-3.0-or-later"

[dependencies]
find-fold = "~0.1"
fxhash = "~0.2"
paste = "~1.0"
rand = "~0.9"
rand_distr = "~0.5"
rulinalg = "~0.4"
rayon = { version = "~1.10", optional = true }
ratatui = { version = "~0.29", optional = true }
serde = { version = "~1.0", features = ["derive"], optional = true }
serde_json = { version = "~1.0", features = ["preserve_order"], optional = true }

[dev-dependencies]
criterion = "~0.5"
flamegraph = "~0.6"

[features]
parallel = ["dep:rayon"]
tui = ["dep:ratatui"]
serialize = ["dep:serde"]
serialize_json = ["dep:serde_json", "serialize"]
smol_bench = []

[[example]]
name = "xor"

[[bench]]
name = "xor"
harness = false
